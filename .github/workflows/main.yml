name: Deploy and Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  # Uncomment id-token: write if you switch method to "oidc" later
  # id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Intermediate so we can gate steps without secrets-in-if (invalid)
      INFISICAL_CID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CSEC: ${{ secrets.INFISICAL_CLIENT_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Secrets from Infisical
        if: env.INFISICAL_CID != '' && env.INFISICAL_CSEC != ''
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ secrets.INFISICAL_ENV_SLUG }}
          domain: https://app.infisical.com

      - name: Verify Environment
        run: |
          if [ -n "$INFISICAL_CID" ] && [ -n "$INFISICAL_CSEC" ]; then
            echo "Infisical credentials present — secret injection attempted (domain: app.infisical.com)"
          else
            echo "::notice::INFISICAL_CLIENT_ID / INFISICAL_CLIENT_SECRET not set."
            echo "::notice::Add them under Settings → Secrets and variables → Actions."
            echo "::notice::See docs/SECRETS_MANAGEMENT.md for Machine Identity setup."
          fi
