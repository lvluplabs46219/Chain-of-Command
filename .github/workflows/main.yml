name: Deploy and Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # BW_ACCESS_TOKEN is often unset in this repo — gate the step so the
      # workflow stays green. When the secret IS present, secrets are loaded.
      - name: Get Secrets from Bitwarden
        if: ${{ secrets.BW_ACCESS_TOKEN != '' }}
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.com
          secrets: |
            ${{ secrets.BW_ITEM_ID_SUPABASE_URL }} > NEXT_PUBLIC_SUPABASE_URL
            ${{ secrets.BW_ITEM_ID_SUPABASE_SERVICE_ROLE_KEY }} > SUPABASE_SERVICE_ROLE_KEY
            ${{ secrets.BW_ITEM_ID_SUPABASE_URL }} > SUPABASE_URL
            ${{ secrets.BW_ITEM_ID_SUPABASE_PUBLISHABLE_KEY }} > NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            ${{ secrets.BW_ITEM_ID_SUPABASE_ANON_KEY }} > NEXT_PUBLIC_SUPABASE_ANON_KEY
            ${{ secrets.BW_ITEM_ID_SUPABASE_PUBLISHABLE_KEY }} > SUPABASE_PUBLISHABLE_KEY
            ${{ secrets.BW_ITEM_ID_SUPABASE_ANON_KEY }} > SUPABASE_ANON_KEY
            ${{ secrets.BW_ITEM_ID_SUPABASE_SERVICE_ROLE_KEY }} > SUPABASE_SECRET_KEY
            ${{ secrets.BW_ITEM_ID_DATABASE_URL }} > DATABASE_URL
            ${{ secrets.BW_ITEM_ID_POSTGRES_URL }} > POSTGRES_URL
            ${{ secrets.BW_ITEM_ID_SUPABASE_JWKS_URL }} > SUPABASE_JWKS_URL
            ${{ secrets.BW_ITEM_ID_DB_HOST }} > DB_HOST
            ${{ secrets.BW_ITEM_ID_DB_PORT }} > DB_PORT
            ${{ secrets.BW_ITEM_ID_DB_NAME }} > DB_NAME
            ${{ secrets.BW_ITEM_ID_DB_USER }} > DB_USER
            ${{ secrets.BW_ITEM_ID_DB_PASSWORD }} > DB_PASSWORD
            ${{ secrets.BW_ITEM_ID_GEMINI_API_KEY }} > GEMINI_API_KEY
            ${{ secrets.BW_ITEM_ID_GCP_SERVICE_ACCOUNT_EMAIL }} > GCP_SERVICE_ACCOUNT_EMAIL
            ${{ secrets.BW_ITEM_ID_OLLAMA_BASE_URL }} > OLLAMA_BASE_URL
            ${{ secrets.BW_ITEM_ID_WEBSCRAPER_API_KEY }} > WEBSCRAPER_API_KEY
            ${{ secrets.BW_ITEM_ID_BOT_TOKEN }} > BOT_TOKEN
            ${{ secrets.BW_ITEM_ID_ANTHROPIC_API_KEY }} > ANTHROPIC_API_KEY
            ${{ secrets.BW_ITEM_ID_GH_TOKEN }} > GH_TOKEN
            ${{ secrets.BW_ITEM_ID_GITHUB_TOKEN_AUDIT }} > GITHUB_TOKEN_AUDIT
            ${{ secrets.BW_ITEM_ID_ALLOWED_ORIGINS }} > ALLOWED_ORIGINS
            ${{ secrets.BW_ITEM_ID_TAILSCALE_BOUND_DOMAINS }} > TAILSCALE_BOUND_DOMAINS
            ${{ secrets.BW_ITEM_ID_POSTMAN }} > POSTMAN

      - name: Verify Environment
        run: |
          if [ -n "${{ secrets.BW_ACCESS_TOKEN }}" ]; then
            echo "Bitwarden secrets loaded successfully"
          else
            echo "::notice::BW_ACCESS_TOKEN not configured — skipping secret injection. Add the secret under Settings → Secrets to enable vault sync."
          fi
