name: Security & QA Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Reject dual lockfiles
        run: |
          if [ -f pnpm-lock.yaml ] && [ -f package-lock.json ]; then
            echo "Both pnpm-lock.yaml and package-lock.json present — pick one package manager"
            exit 1
          fi

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json yet — using npm install"
            npm install --no-audit --no-fund
          fi

      - name: Security Scan (npm audit — critical)
        run: npm audit --audit-level=critical

      # On push: base = previous tip (github.event.before) so the pushed
      # range is scanned. On PR: base = default branch. Avoids BASE==HEAD
      # which causes TruffleHog to exit 1 and skip typecheck/build.
      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.event.before }}
          head: HEAD
          extra_args: --only-verified

      - name: Type Check
        run: npm run typecheck

      - name: Build web
        run: npm run build
        env:
          NODE_ENV: production

      - name: Provider lockout (demo banned in production)
        run: npx tsx apps/api/tests/provider-lockout.test.ts

      - name: API security smoke (if test file present)
        run: |
          if [ -f apps/api/tests/security.test.ts ]; then
            npx tsx apps/api/tests/security.test.ts || exit 1
          else
            echo "No security.test.ts — skip"
          fi
