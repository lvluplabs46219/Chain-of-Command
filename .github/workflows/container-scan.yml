name: Container Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image (failure must fail this job)
        run: docker build -t chain-of-command:ci .
      - name: Scan image (high and critical findings fail)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: chain-of-command:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
