name: Playwright Scraper Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Detect Playwright config
      id: pwcfg
      run: |
        if compgen -G 'playwright.config.*' > /dev/null; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "No playwright.config.* found - skipping Playwright tests."
        fi

    - name: Install dependencies
      if: steps.pwcfg.outputs.exists == 'true'
      run: npm install --no-audit --no-fund

    - name: Install Playwright Browsers
      if: steps.pwcfg.outputs.exists == 'true'
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      if: steps.pwcfg.outputs.exists == 'true'
      run: npx playwright test --passWithNoTests
      env:
        NODE_ENV: test

    - uses: actions/upload-artifact@v4
      if: always() && steps.pwcfg.outputs.exists == 'true'
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
