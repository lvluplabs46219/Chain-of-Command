name: Playwright E2E (manual, configuration required)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require a real Playwright configuration
        shell: bash
        run: |
          shopt -s nullglob
          configs=(playwright.config.*)
          if [ "${#configs[@]}" -eq 0 ]; then
            echo "::error::No Playwright config exists. E2E coverage is not configured."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm exec --no -- playwright install --with-deps chromium
      - run: npm exec --no -- playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
