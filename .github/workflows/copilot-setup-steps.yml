# Custom setup steps for the GitHub Copilot coding agent.
# NOTE: 'on: workflow_dispatch' prevents GitHub from treating this file as a
# push-triggered workflow (it has no 'jobs' section, so push runs always failed
# with an invalid-workflow startup error). Copilot reads the 'setup' key by
# filename, so this remains fully functional for the agent environment.
on: workflow_dispatch

version: 1
setup:
  - name: Install Dependencies
    command: npm install --no-audit --no-fund
  - name: Setup Local Environment
    command: cp -n .env.example .env.local || true
  - name: Type Check & Verify Setup
    # There is no root tsconfig.json, so 'tsc --build' alone fails (TS5058).
    # Build the real workspace projects instead; keep setup non-blocking so a
    # type error cannot break the agent environment entirely.
    command: npx tsc --build apps/web apps/api packages/db packages/rag-engine scripts || echo "warning: typecheck reported errors (non-blocking)"
