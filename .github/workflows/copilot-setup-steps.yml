# Official Copilot coding-agent setup workflow.
# Job name MUST be "copilot-setup-steps" for Copilot to pick it up.
# GitHub validates this file on every push that touches it.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called copilot-setup-steps or Copilot will ignore it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - name: Setup Local Environment
        continue-on-error: true
        run: cp -n .env.example .env.local || true

      - name: Type Check (workspace projects)
        continue-on-error: true
        run: |
          npx tsc --build apps/web apps/api packages/db packages/rag-engine scripts \
            || echo "warning: typecheck reported errors (non-blocking)"
