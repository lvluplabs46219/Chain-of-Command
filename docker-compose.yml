version: '3.9'
services:
  chain-of-command:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/chain_of_command?pgbouncer=true
      PINATA_JWT: ${PINATA_JWT}
      UNICOURT_API_KEY: ${UNICOURT_API_KEY}
      DOXPOP_API_KEY: ${DOXPOP_API_KEY}
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chain_of_command
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
